spring.application.name=KodikaraGroupBusinessManagementApplication

# --- DATABASE (MySQL) CONFIGURATION ---
spring.datasource.url=jdbc:mysql://localhost:3306/kodikara_db
spring.datasource.username=root
spring.datasource.password=root

# --- JPA & HIBERNATE CONFIGURATION ---

# "update" will automatically create/alter tables to match your @Entity classes.
# (You had "validate", which causes a crash if tables don't exist)
spring.jpa.hibernate.ddl-auto=update

# This tells Hibernate to use the correct SQL "language" for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This prints all SQL queries to the console, which is very good for debugging
spring.jpa.show-sql=true